id = "xlang"
name = "xlang"
description = "xlang language support for Zed: syntax highlighting, brackets, comments and the xl toolchain integration."
version = "0.1.0"
schema_version = 1
authors = ["The xlang authors <https://github.com/hasirciogluhq>"]
repository = "https://github.com/hasirciogluhq/xl-zed"
keywords = ["xlang", "xlc", "llvm", "systems"]

[grammars.xlang]
repository = "https://github.com/hasirciogluhq/xl-zed"
rev = "main"
path = "languages/xlang/xlang.tmLanguage.json"

[language_servers.xlang-lsp]
name = "xlang LSP"

[language_servers.xlang-lsp.languages]
languages = ["xlang"]
